name: Record X fixtures

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          ALL: every link of links.json (can take tens of minutes).
          ONLY: the links containing the value.
          NEW: a temporary fixture for the link given as value.
        required: true
        type: choice
        options: [ALL, ONLY, NEW]
      value:
        description: "ONLY: the filter passed to --only. NEW: the x.com link to record. ALL: ignored."
        type: string
      description:
        description: >-
          NEW only: the scenario description. Given, the patch also adds the link to links.json, so
          the fixture can be committed to QuaX.
        type: string
      screenshot:
        description: "ONLY and NEW only: add a screenshot of each captured link to the artifact."
        type: boolean
        default: false

permissions: {}

# One X account is shared by every run: parallel captures would only rate-limit each other.
concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 240
    env:
      MODE: ${{ inputs.mode }}
      VALUE: ${{ inputs.value }}
      DESCRIPTION: ${{ inputs.description }}
      SCREENSHOT: ${{ inputs.screenshot }}
      LINKS: tool/record/links.json
    steps:
      - name: Check the inputs
        run: |
          case "$MODE" in
            ONLY) [ -n "$VALUE" ] || { echo "::error::ONLY needs a filter as value"; exit 1; } ;;
            NEW) [[ "$VALUE" =~ ^https://x\.com/[^[:space:]]+$ ]] \
                   || { echo "::error::NEW needs an https://x.com/ link as value"; exit 1; } ;;
          esac
          [ -z "$DESCRIPTION" ] || [ "$MODE" = NEW ] \
            || { echo "::error::A description is only used with NEW"; exit 1; }
          [ "$SCREENSHOT" != true ] || [ "$MODE" != ALL ] \
            || { echo "::error::Screenshots need ONLY or NEW"; exit 1; }

      - name: Clone QuaX
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Teskann/QuaX
          ref: master
          path: quax
          persist-credentials: false

      - name: Clone the recorder
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: recorder
          persist-credentials: false

      - name: Install and set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: quax/.fvmrc
          cache: true

      - name: Install the dependencies
        working-directory: quax
        run: |
          flutter config --no-analytics
          flutter pub get

      # links.json only tells capture.dart which pages to open: the patch leaves it out. The new
      # link is the only one in it, as capture.dart opens every link containing the --only text: an
      # existing https://x.com/foo/media must not be recaptured for https://x.com/foo. The scenario is
      # kept aside for the patch, which adds it to links.json when it has a description.
      - name: Keep only the new link
        if: inputs.mode == 'NEW'
        working-directory: quax
        run: |
          if jq -e --arg url "$VALUE" 'any(.scenarios[]; .url == $url)' "$LINKS" > /dev/null; then
            echo "::error::$VALUE is already in links.json: use ONLY instead"
            exit 1
          fi
          jq -n --arg url "$VALUE" --arg description "$DESCRIPTION" '{
            url: $url,
            description: (if $description == "" then "TEMPORARY fixture recorded by quax-x-recorder for a demo: never merge it upstream" else $description end),
            unstable: true
          }' > "$RUNNER_TEMP/scenario.json"
          jq --slurpfile scenario "$RUNNER_TEMP/scenario.json" '.scenarios = $scenario' \
            "$LINKS" > "$RUNNER_TEMP/links.json"
          mv "$RUNNER_TEMP/links.json" "$LINKS"

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Leave through the exit node
        env:
          EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
        run: |
          before=$(curl -fsS --max-time 20 https://ifconfig.me)
          sudo tailscale set --exit-node="$EXIT_NODE"
          sudo tailscale ping -c 3 "$EXIT_NODE" > /dev/null
          after=$(curl -fsS --max-time 20 https://ifconfig.me)
          [ "$before" != "$after" ] || { echo "::error::Traffic still leaves from the runner"; exit 1; }

      # Chrome runs with a window, as chrome.dart starts it: headless is detectable, hence a virtual
      # display.
      - name: Log in to X
        working-directory: quax
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          cp ../recorder/scripts/inject_cookies.dart tool/record/
          xvfb-run -a -s '-screen 0 1920x1080x24' dart run tool/record/inject_cookies.dart
          rm tool/record/inject_cookies.dart

      # Allowed to fail so the patch of a partial capture is still published; the last step fails
      # the job.
      - name: Capture
        id: capture
        continue-on-error: true
        working-directory: quax
        run: |
          args=()
          [ "$MODE" = ALL ] || args+=(--only "$VALUE")
          xvfb-run -a -s '-screen 0 1920x1080x24' dart run tool/record/capture.dart "${args[@]}" < /dev/null

      # Opens the links again once the capture is over, in the same logged-in profile.
      - name: Screenshot
        id: screenshot
        if: inputs.screenshot
        continue-on-error: true
        working-directory: quax
        run: |
          cp ../recorder/scripts/screenshot.dart tool/record/
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            dart run tool/record/screenshot.dart "$VALUE" "$RUNNER_TEMP/artifact/screenshots"
          rm tool/record/screenshot.dart

      - name: Make the patch
        working-directory: quax
        # NEW keeps only the files it created: the existing fixtures it rewrote (shared operations,
        # headers, counters) already answer the same requests in the mock. With a description, the
        # scenario is appended to links.json as text, so the rest of the file keeps its layout.
        run: |
          rm -f tool/record/screenshot.dart # left behind by a failed screenshot
          if [ "$MODE" = NEW ]; then git checkout -- .; else git checkout -- "$LINKS"; fi
          if [ "$MODE" = NEW ] && [ -n "$DESCRIPTION" ]; then
            python3 ../recorder/scripts/append_scenario.py "$LINKS" "$RUNNER_TEMP/scenario.json"
          fi
          git add -A
          mkdir -p "$RUNNER_TEMP/artifact"
          git diff --cached --binary > "$RUNNER_TEMP/artifact/capture.patch"
          {
            echo "### Capture ($MODE${VALUE:+: $VALUE})"
            echo '```'
            git diff --cached --stat | tail -n 30
            echo '```'
            echo 'Apply it at the root of QuaX with `git apply capture.patch`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the patch
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: capture-patch
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error

      - name: Fail if the capture or a screenshot failed
        if: steps.capture.outcome == 'failure' || steps.screenshot.outcome == 'failure'
        env:
          CAPTURE: ${{ steps.capture.outcome }}
          SCREENSHOT_OUTCOME: ${{ steps.screenshot.outcome }}
        run: |
          [ "$CAPTURE" != failure ] \
            || echo "::error::The capture failed: see its step. The patch holds what was recorded anyway."
          [ "$SCREENSHOT_OUTCOME" != failure ] || echo "::error::A screenshot failed: see its step."
          exit 1
